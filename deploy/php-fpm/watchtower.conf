; Пул php-fpm приложения. Устанавливается в /etc/php/8.5/fpm/pool.d/watchtower.conf
; Штатный пул www отключается (pool.d/www.conf переименовывается в www.conf.disabled):
; два пула на 1 ГБ делят память вслепую, а второй здесь не нужен.

[watchtower]

; Рабочие процессы от системного пользователя приложения, не от www-data
; и не от root. Компрометация PHP даёт права ровно на storage/ и bootstrap/cache.
user = watchtower
group = watchtower

; Сокет вместо TCP: обращение локальное, петля TCP добавила бы сетевой стек
; и открытый порт без единого выигрыша.
listen = /run/php/watchtower.sock

; Сокет создаётся от watchtower, читать и писать в него может только nginx.
; 0660 без указания группы дал бы nginx отказ в доступе — самая частая ошибка
; при разделении пользователей приложения и веб-сервера.
listen.owner = watchtower
listen.group = nginx
listen.mode = 0660

; ondemand: процессы поднимаются под запрос и гаснут после простоя.
; Выбран против dynamic из-за 1 ГБ: между проверками трафика почти нет,
; и держать прогретых рабочих смысла нет — освобождённая память уходит
; в страничный кэш, который понадобится PostgreSQL на Story 1.2.
; Цена — форк на первом запросе после простоя. Она мала: сегмент разделяемой
; памяти opcache наследуется от мастера, повторной компиляции скриптов нет.
pm = ondemand
pm.process_idle_timeout = 60s

; РАСЧЁТ pm.max_children — замер на этой машине 13.08.2026, не переписан
; из статьи. Мерялось /proc/PID/smaps_rollup после прогрева 12 запросами.
;
; Память. Всего 961 МБ.
;   RSS рабочего процесса  35.8 МБ  — с разделяемыми страницами
;   PSS рабочего процесса   6.4 МБ  — цена ДОПОЛНИТЕЛЬНОГО процесса
;   php-fpm мастер          11 МБ
;   nginx (мастер+воркеры)  12 МБ
; RSS считает сегмент opcache и библиотеки заново каждому процессу, поэтому
; для планирования годится PSS. Свободного под рабочие процессы ~550 МБ,
; то есть по памяти помещается 550 / 35.8 ~ 15 даже по пессимистичному RSS.
;
; Упирается не в память, а в процессор: ядро одно. Запрос к PHP счётный,
; не ждущий ввода-вывода, поэтому рабочие процессы сверх числа ядер не
; добавляют пропускной способности — они добавляют длину очереди и время
; ответа. Отсюда 8: вчетверо больше ядер как запас на ожидание сети и диска,
; но не 15, за которые заплатили бы задержкой.
;
; Худший случай — все 8 упёрлись в memory_limit: 8 x 128 = 1024 МБ, больше
; RAM. Принято сознательно: типовой случай 8 x 6.4 = 51 МБ (PSS), а исчерпание
; пула входит в план chaos-упражнений ступени 0 — поведение под этим пределом
; проверяется отдельно, а не предполагается.
pm.max_children = 8

; Перезапуск рабочего процесса после N запросов — страховка от утечек
; в расширениях: процесс живёт ограниченно и отдаёт память обратно.
pm.max_requests = 500

; Статус пула нужен для метрик исполнителя (Эпик 5). Отдаётся только
; через сокет, наружу nginx его не публикует до Story 1.11 с зонами доступа.
pm.status_path = /fpm-status

; Логи в JSON пишет приложение (NFR8). Здесь остаётся только то, что
; приложение записать не успевает: аварии самого рабочего процесса.
catch_workers_output = yes
decorate_workers_output = no

; Жёсткий предел на запрос. Веб-запрос в этом проекте синхронный и коротий:
; проверки исполняет отдельный процесс, а не php-fpm.
request_terminate_timeout = 30s

; Запись разрешена только там, где она нужна Laravel. open_basedir отсекает
; чтение произвольных файлов машины из PHP.
php_admin_value[open_basedir] = /srv/watchtower:/tmp
php_admin_value[error_log] = /var/log/php8.5-fpm.watchtower.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; Заголовок X-Powered-By с версией PHP не отдаётся.
php_admin_value[expose_php] = off

; Предел памяти на запрос. Задан явно, а не унаследован из php.ini: расчёт
; pm.max_children выше опирается на это число, и молчаливая смена умолчания
; при обновлении PHP сломала бы расчёт незаметно.
php_admin_value[memory_limit] = 128M
