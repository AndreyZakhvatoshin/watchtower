# Общие параметры TLS. Подключается из каждого server-блока на 443.
# Цель — оценка не ниже A у внешнего анализатора (NFR7).
# Устанавливается в /etc/nginx/conf.d/tls-params.conf

# Только TLS 1.2 и 1.3. 1.0/1.1 сняты с поддержки IETF и штрафуются анализатором.
ssl_protocols TLSv1.2 TLSv1.3;

# Набор шифров задаётся только для 1.2: в TLS 1.3 набор фиксирован протоколом
# и директивой ssl_ciphers не управляется. Список — конфигурация Mozilla
# intermediate: все режимы AEAD с прямой секретностью, без CBC и без RSA-обмена.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# off — порядок выбирает клиент. Мобильный клиент без аппаратного AES выберет
# ChaCha20 и получит быстрее; навязывание серверного порядка этому мешает,
# а защиты не добавляет, поскольку слабых наборов в списке нет.
ssl_prefer_server_ciphers off;

# Кривые для обмена ключами, X25519 первой — она быстрее P-256 и реализована
# без операций с переменным временем.
ssl_ecdh_curve X25519:prime256v1:secp384r1;

# Возобновление сессии кэшем на стороне сервера. 10 МБ — около 40 тыс. сессий.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Тикеты выключены: без ротации ключа тикета возобновлённая сессия
# расшифровывается задним числом при краже ключа, то есть прямая секретность
# теряется. nginx ключ не ротирует сам.
ssl_session_tickets off;

# OCSP stapling НЕ включается намеренно.
# Let's Encrypt выключил OCSP-респондеры; в выпущенном 11.08.2026 сертификате
# расширение authorityInfoAccess содержит только "CA Issuers", поля "OCSP - URI"
# нет. Директива ssl_stapling при таком сертификате не делает ничего и пишет
# в error_log "no OCSP responder URL in the certificate".
# Проверка: openssl x509 -in fullchain.pem -noout -ext authorityInfoAccess
