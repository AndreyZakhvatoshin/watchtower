# Хост приложения. Устанавливается в /etc/nginx/conf.d/watchtower.conf
#
# В пакете с nginx.org нет каталогов sites-available/sites-enabled — nginx.conf
# подключает только conf.d/*.conf. Схема с симлинками здесь не работает.
#
# listen [::] не указан: у VDS нет глобального адреса IPv6
# (ip -6 addr show scope global пуст на 13.08.2026). Слушать порт, на который
# никто не придёт, — лишняя открытая точка.

# HTTP только для редиректа. Проверок ACME здесь нет: сертификат выпускается
# через DNS-01, для wildcard других вариантов не существует, и HTTP-01
# не используется вовсе.
server {
    listen 80;
    server_name watchtower.mastetlab.ru;

    # Версия nginx не отдаётся и здесь тоже: заголовок Server виден на редиректе
    # ровно так же, как на самой странице, а server_tokens действует только
    # в том блоке, где объявлен.
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name watchtower.mastetlab.ru;

    root /srv/watchtower/public;
    index index.php;

    charset utf-8;

    # Пути стабильные, а не внутренний каталог acme.sh: содержимое ~/.acme.sh
    # считается приватным для самого acme.sh, ссылаться на него из конфигурации
    # сервиса он не даёт. Файлы кладёт сюда acme.sh --install-cert.
    ssl_certificate     /etc/ssl/watchtower/fullchain.pem;
    ssl_certificate_key /etc/ssl/watchtower/mastetlab.ru.key;

    include /etc/nginx/conf.d/tls-params.conf;

    # HSTS. two years — значение из списка предзагрузки; includeSubDomains
    # распространяется на поддомены самого watchtower.mastetlab.ru, апекса
    # и status. не касается. always нужен, чтобы заголовок ушёл и с кодами
    # 4xx/5xx: без него nginx добавляет заголовок только к 200/201/204/301/302/304.
    # ВНИМАНИЕ при правке: add_header наследуется целиком или не наследуется
    # вовсе. Один add_header во вложенном location отменяет ВСЕ заголовки
    # родителя в этом location — не добавляет к ним, а замещает набор.
    # Поэтому все заголовки живут здесь, на уровне server.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Запрещает браузеру угадывать тип содержимого вопреки Content-Type.
    # Без него загруженный файл, отданный как text/plain, может быть
    # исполнен как HTML или скрипт по итогам «вынюхивания».
    add_header X-Content-Type-Options "nosniff" always;

    # Referer при переходе наружу обрезается до origin: чужой сайт не узнает
    # полный путь, с которого пришли, вместе с идентификаторами в URL.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Запрет на встраивание в чужой фрейм — защита от кликджекинга.
    # frame-ancestors из CSP — современная форма, X-Frame-Options оставлен
    # для браузеров, которые её не знают. Оба нужны только вместе.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    # Скрывает версию nginx в заголовке Server и на страницах ошибок.
    server_tokens off;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Единственная точка входа в PHP. Знак = означает точное совпадение:
    # интерпретатору доступен ровно один файл, и поиск location на нём
    # прекращается сразу, не доходя до регулярных выражений.
    #
    # Опасен не суффикс, а передача PATH_INFO. При схеме
    # `location ~ \.php` (без $) или при cgi.fix_pathinfo=1 запрос
    # /uploads/avatar.jpg/x.php приводит к тому, что SCRIPT_FILENAME
    # разрешается в существующий файл-префикс, и загруженная картинка
    # исполняется как код. Точное совпадение закрывает оба пути.
    location = /index.php {
        fastcgi_pass unix:/run/php/watchtower.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # PATH_INFO не передаётся, cgi.fix_pathinfo не участвует —
        # классическая дыра «исполнение произвольного файла как PHP» закрыта
        # тем, что интерпретатору доступен ровно один скрипт.
        fastcgi_hide_header X-Powered-By;

        # Страховка второго уровня — на стороне php-fpm:
        # security.limit_extensions = .php в пуле. Она не полагается на то,
        # что nginx настроен верно.

        fastcgi_read_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Любой другой .php в public/ — 404, а не отдача исходника.
    location ~ \.php$ {
        return 404;
    }

    # Точечные файлы (.env, .git/, .htaccess) не отдаются.
    # Исключение .well-known оставлено: там живут security.txt и проверки,
    # не связанные с ACME.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/watchtower.access.log;
    error_log  /var/log/nginx/watchtower.error.log;
}

# Сервер по умолчанию: закрывает обращения по IP и по чужому Host.
# Без него первый же server-блок становится дефолтным, и сканеры ботов
# получают приложение в ответ на запрос с любым именем.
# 444 — нестандартный код nginx: соединение закрывается без ответа.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    server_tokens off;

    ssl_certificate     /etc/ssl/watchtower/fullchain.pem;
    ssl_certificate_key /etc/ssl/watchtower/mastetlab.ru.key;
    include /etc/nginx/conf.d/tls-params.conf;

    return 444;
}
