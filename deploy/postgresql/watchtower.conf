# Параметры PostgreSQL под машину 1 vCPU / 1 ГБ, где база делит память
# с php-fpm и nginx. Устанавливается в /etc/postgresql/18/main/conf.d/watchtower.conf
# (postgresql.conf в сборке Debian заканчивается include_dir = 'conf.d').
#
# Отдельный файл, а не правка postgresql.conf: обновление пакета перепишет
# основной файл, а этот переживёт. Тот же приём, что с drop-in у systemd
# и с 00-hardening.conf у sshd.
#
# БЮДЖЕТ ПАМЯТИ МАШИНЫ (961 МБ):
#   ОС, ssh, journald            ~200 МБ
#   nginx                         ~20 МБ
#   php-fpm (cgroup MemoryMax)    500 МБ — потолок, типовое потребление ~51 МБ (PSS)
#   PostgreSQL                   ~180 МБ — этот файл
#   -----------------------------------
# Потолки в сумме превышают RAM. Это осознанно: 500 МБ у php-fpm — предел
# аномалии, а не расход. Если PostgreSQL начнёт упираться, снижать надо
# именно этот потолок, а не shared_buffers — измерять до правки.

# Кэш страниц самой БД. Обычная рекомендация «25% RAM» здесь неприменима:
# 25% от 961 = 240 МБ, и это выдавило бы php-fpm. 96 МБ хватает, потому что
# рабочий набор ступени 0 — одна таблица проверок в несколько десятков строк.
# Пересматривать, когда появится история результатов (Story 1.6).
shared_buffers = 96MB

# Не выделяемая память, а подсказка планировщику: сколько данных, по его
# мнению, лежит в кэше ОС. Влияет на выбор между индексом и полным сканом.
# Считается от свободной памяти машины, а не от лимита PostgreSQL.
effective_cache_size = 256MB

# Память на один узел сортировки или хеширования. Умножается на число
# одновременных операций, а не на число соединений: сложный запрос берёт
# несколько порций. При 20 соединениях худший случай — десятки таких порций,
# поэтому значение маленькое.
work_mem = 4MB

# Для VACUUM, CREATE INDEX, ALTER TABLE. Разовые операции, их немного,
# поэтому можно щедрее, чем work_mem.
maintenance_work_mem = 48MB

# Ядро одно, приложение обращается к базе из php-fpm (не более 8 рабочих
# процессов) плюс миграции и psql руками. 20 с запасом. Каждое соединение
# в PostgreSQL — отдельный процесс ОС со своей памятью, поэтому лимит
# защищает не базу, а машину.
max_connections = 20

# Только петля. Сетевой доступ к базе не нужен никому, кроме ядра (AD-1);
# в сборке Debian это и так умолчание, но записано явно — умолчания меняются
# молча, а требование архитектуры должно быть видно в конфигурации.
listen_addresses = 'localhost'

# Журнал: медленные запросы и все ошибки. Порог 200 мс выбран как заведомо
# аномальный для запросов ступени 0 — здесь нет ни одного запроса, который
# имел бы право столько работать.
log_min_duration_statement = 200ms
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_autovacuum_min_duration = 0

# Время в базе хранится и отдаётся в UTC (AD-8, NFR6). Перевод в местную
# зону — только на отображении.
timezone = 'UTC'
log_timezone = 'UTC'
