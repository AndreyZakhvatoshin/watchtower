# Ограничение памяти пула через cgroups.
# Устанавливается как drop-in: /etc/systemd/system/php8.5-fpm.service.d/memory.conf
#
# Задача — превратить «OOM killer выбирает жертву по всей машине» в
# «пул упёрся в свой предел». Без этого худший случай (8 рабочих процессов
# по memory_limit = 128M) съедает 1024 МБ при 961 МБ RAM и отсутствии swap,
# и ядро может убить nginx или sshd, а не PHP: OOM killer выбирает по
# oom_score, а не по виновности.
#
# Предел ставится на сервис целиком — мастер php-fpm и все рабочие процессы
# лежат в одной cgroup.

[Service]
# Мягкий порог: за ним ядро начинает давить на cgroup — отбирать страничный
# кэш и вытеснять. Процессы не убиваются, но замедляются. Это сигнал в
# метриках раньше, чем случится авария.
MemoryHigh=400M

# Жёсткий предел: за ним ядро убивает процесс ВНУТРИ этой cgroup.
# 500 МБ при 961 МБ всего: остаётся ~460 МБ на ОС, nginx, ssh и страничный
# кэш. Замер даёт 8 x 36 = 288 МБ по RSS, то есть штатная работа проходит
# с запасом, а до предела доходит только аномалия.
MemoryMax=500M

# Счётчик срабатываний виден в `systemctl status php8.5-fpm` и в
# `systemd-cgtop`. Проверка после chaos-упражнения:
#   systemctl show php8.5-fpm -p MemoryMax -p MemoryHigh -p MemoryCurrent
